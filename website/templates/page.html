{% extends "base.html" %} {% block content %}

<div class="cell cell--4 padding">
  {% if page.date %}
    <time class="opacity-50" datetime="{{page.date}}">{{page.date}}</time>
  {% endif %}
  <h1>{{page.title}}</h1>
</div>

<div class="padding content">{{ page.content | safe }}</div>

{% endblock content %}
