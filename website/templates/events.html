{% extends "base.html" %}

{% block content %}

<div class="cell cell--4 padding">
  {% if section.date %}
    <time datetime="{{section.date}}">{{section.date}}</time>
  {% endif %}
  <h1>{{section.title}}</h1>
</div>

<div class="padding content">{{ section.content | safe }}</div>

<div class="grid events">
  {% for event in section.pages %}
    {% set event = event %}
    {% include "partials/event-card.html" %}
  {% endfor %}
</div>

{% endblock content %}
