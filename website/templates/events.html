{% extends "base.html" %} {% block content %}

<div class="cell cell--4 padding">
  {% if page.date %}
  <time datetime="{{page.date}}">{{page.date}}</time>
  {% endif %}
  <h1>{{page.title}}</h1>
</div>

<div class="padding content">{{ page.content | safe }}</div>

{% if (page.extra.events) %}
<div class="grid events">
  {% for event in page.extra.events %} {% include "partials/event-card.html" %}
  {% endfor %}
</div>
{% endif %} {% endblock content %}
